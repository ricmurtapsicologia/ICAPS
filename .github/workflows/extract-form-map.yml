name: Extract ICAPS Google Form map

on:
  push:
    paths:
      - '.github/workflows/extract-form-map.yml'

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public Google Form metadata
        shell: bash
        run: |
          python - <<'PY'
          import json, re, urllib.request
          url='https://docs.google.com/forms/d/e/1FAIpQLScyXa5vZ_uwykhBi2dzhLqGb8MrgJ0MDF6llfmc20G1RKruqw/viewform'
          req=urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req, timeout=30) as r:
              html=r.read().decode('utf-8','replace')
          open('form-source.html','w',encoding='utf-8').write(html)
          m=re.search(r'FB_PUBLIC_LOAD_DATA_\s*=\s*(\[.*?\]);\s*</script>', html, re.S)
          if not m:
              m=re.search(r'FB_PUBLIC_LOAD_DATA_\s*=\s*(\[.*\]);', html, re.S)
          if m:
              raw=m.group(1)
              open('fb-public-load-data.json','w',encoding='utf-8').write(raw)
              try:
                  data=json.loads(raw)
                  open('fb-public-load-data.pretty.json','w',encoding='utf-8').write(json.dumps(data,ensure_ascii=False,indent=2))
              except Exception as e:
                  open('parse-error.txt','w').write(str(e))
          ids=sorted(set(re.findall(r'entry\.(\d+)', html)), key=int)
          open('entry-ids.txt','w').write('\n'.join(ids))
          print('html_bytes', len(html), 'entry_ids', len(ids), 'fb_data', bool(m))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: icaps-form-map
          path: |
            form-source.html
            fb-public-load-data.json
            fb-public-load-data.pretty.json
            entry-ids.txt
            parse-error.txt
          if-no-files-found: warn
          retention-days: 1
